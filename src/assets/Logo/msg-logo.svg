<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#9c7a2e"/>
    </linearGradient>
  </defs>

  <!-- Monogram mark -->
  <g transform="translate(60,50)">
    <text x="65" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600"
          fill="#0b2545" text-anchor="middle">MSG</text>
  </g>

  <!-- Company name -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0b2545">
    <text x="230" y="100" font-size="42" font-weight="600" letter-spacing="0.5">Management Services Group</text>
    <text x="230" y="145" font-size="24" letter-spacing="4" fill="url(#goldGrad)">SAL (OFFSHORE)</text>
  </g>

  <!-- divider line -->
  <line x1="230" y1="165" x2="950" y2="165" stroke="#c9a24b" stroke-width="1.5"/>

  <text x="230" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#4a5568" letter-spacing="2">
    CORPORATE &amp; MANAGEMENT SERVICES
  </text>
</svg>
