    <text x="230" y="100" font-size="42" font-weight="600" letter-spacing="0.5">Management Services Group</text>
    <text x="230" y="145" font-size="24" letter-spacing="4" fill="url(#goldGrad)">SAL (OFFSHORE)</text>
